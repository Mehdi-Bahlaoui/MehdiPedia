[package]
name = "globe-web"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wasm-bindgen = "=0.2.108"

[dependencies.web-sys]
version = "=0.3.85"
features = [
    "console",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "MouseEvent",
    "Node",
    "PointerEvent",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Window",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# wasm size matters more than frame time for this scene: the whole thing is
# 9k points and a 2k-vertex sphere. Keep the binary as small as possible.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
