<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Confetti Preview — mini3d</title>

  <link rel="modulepreload" href="./wasm/confetti_app.js?v=1" crossorigin>
  <link rel="preload" href="./wasm/confetti_app.wasm?v=1" as="fetch" type="application/wasm" crossorigin>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #202122;
      --muted: #54595d;
      --card: rgba(248, 249, 250, 0.85);
      --border: #a2a9b1;
    }

    [data-theme="dark"] {
      --bg: #101418;
      --fg: #eaecf0;
      --muted: #a2a9b1;
      --card: rgba(24, 30, 36, 0.82);
      --border: #3a4047;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background 0.2s ease, color 0.2s ease;
    }

    #confetti-container {
      position: fixed;
      inset: 0;
    }

    #confetti-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      cursor: grab;
      touch-action: none;
    }

    #confetti-container canvas:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      backdrop-filter: blur(8px);
      font-size: 13px;
    }

    .hud strong {
      font-size: 14px;
    }

    .hud span {
      color: var(--muted);
    }

    .hud button {
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--fg);
      font-size: 12px;
      cursor: pointer;
    }

    .hud button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="hud">
    <div>
      <strong>3D Confetti</strong>
      <span>· 1,200 instanced quads · ~20 KB wasm (gzip) · drag to orbit</span>
    </div>
    <button id="theme-btn" type="button">Light / Dark</button>
  </div>

  <div id="confetti-container"></div>

  <script>
    document.getElementById('theme-btn').addEventListener('click', () => {
      const root = document.documentElement;
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    });
  </script>

  <script type="module">
    import init from './wasm/confetti_app.js?v=1';

    init({ module_or_path: './wasm/confetti_app.wasm?v=1' })
      .catch((error) => console.error('[confetti] failed to start', error));
  </script>
</body>

</html>
