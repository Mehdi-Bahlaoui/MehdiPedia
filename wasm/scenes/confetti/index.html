<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confetti Launcher — mini3d + WebGL2</title>
  <link data-trunk rel="rust" data-wasm-opt="z" />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #101418;
    }

    #confetti-container {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
    }

    #confetti-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="confetti-container"></div>
</body>

</html>
