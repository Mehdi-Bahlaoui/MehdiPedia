[workspace]
resolver = "2"
members = [
    "crates/mini3d",
    "scenes/globe",
    "scenes/confetti",
]

[workspace.dependencies]
mini3d = { path = "crates/mini3d" }
wasm-bindgen = "=0.2.108"

[workspace.dependencies.web-sys]
version = "=0.3.85"
features = [
    "console",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "MouseEvent",
    "Node",
    "PointerEvent",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Window",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Keep every scene binary as small as possible. LTO strips unused engine
# primitives per scene.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
